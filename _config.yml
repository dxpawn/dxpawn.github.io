# Site

title: "lactose intolerance 🤯"
description: "A GitHub Pages blog"
url: "https://dxpawn.github.io"

# GitHub Pages / Jekyll
# Using a supported theme via remote_theme.
remote_theme: pages-themes/cayman@v0.2.0

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

# Build settings
markdown: kramdown

# Content
permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
